name: release

# Push a tag (v0.1.0) and this publishes a GitHub Release whose asset is the
# same reproducible zip `npm run pack` produces locally. The DSH plugin manager
# can install straight from that asset (`release <owner> <repo> latest`), and a
# release is also what people expect to find on an npm-style package page.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # pack.mjs reads the HEAD commit time
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: npm test
      - name: Pack
        run: npm run pack
      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS.txt --generate-notes
